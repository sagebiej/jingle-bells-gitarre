<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<title>Jingle Bells – Tonleiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Learning the note names in order: C D E F G A H C, forwards, backwards and from any start.
   Each right answer sounds and lands on the staff, so the scale grows like a staircase. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--ink:light-dark(#16181d,#eef0f3);--paper:light-dark(#ffffff,#1b1e24);--soft:light-dark(#f4f1ec,#22262d);--line:light-dark(#2a2d33,#c9ced6);--mute:light-dark(#6b6f78,#9aa1ac);--red:light-dark(#c8102e,#a80d27);--green:light-dark(#1d7a4f,#2fa36c);--gold:#f2b705;--goldsoft:light-dark(#fff3c4,#4a3b08);--bad:light-dark(#c8102e,#ff6b7f)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.band{padding:14px max(4vw,16px,env(safe-area-inset-right)) 14px max(4vw,16px,env(safe-area-inset-left))}
header{background:var(--red);color:#fff;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-top:max(14px,calc(env(safe-area-inset-top) + 6px))!important}
h1{font:600 clamp(26px,5vw,40px)/1.05 Fredoka,system-ui,sans-serif;margin:0}
header a{color:#fff;font-weight:800;text-decoration:none;opacity:.92;margin-right:14px}
header a:hover{text-decoration:underline}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:inherit;font:700 15px Nunito,sans-serif;padding:8px 14px;border-radius:999px;min-height:42px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#a00d25}
.segd{background:var(--soft);color:var(--ink)}
.segd button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{max-width:760px;margin:0 auto}
.ask{font:600 24px/1.25 Fredoka,sans-serif;margin:12px 0}
.ask b{color:var(--red)}
.card{background:var(--soft);border-radius:16px;padding:14px 16px;margin-bottom:14px}
/* the staircase of name chips */
#chips{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:nowrap;min-height:120px;padding-top:6px}
.chip{flex:1;max-width:64px;border-radius:12px;background:var(--paper);border:2px dashed color-mix(in srgb,var(--line) 35%,transparent);display:grid;place-items:center;font:600 24px Fredoka,sans-serif;height:50px;position:relative;transition:transform .15s}
.chip.on{border-style:solid;border-color:var(--green);color:var(--green)}
.chip.given{border-style:solid;border-color:transparent;color:var(--ink)}
.chip.next{border-color:var(--gold);border-style:solid;background:var(--goldsoft)}
.chip.wrong{border-color:var(--bad);color:var(--bad);border-style:solid}
.chip .half{position:absolute;left:-11px;top:-20px;font:800 12px Nunito,sans-serif;color:var(--red)}
#sv{width:100%;max-width:560px;margin:6px auto 0;display:block;height:auto}
.st line{stroke:var(--line);stroke-width:1.3}
.nh{fill:var(--ink)}.nh.ok{fill:var(--green)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.pick{border:2px solid transparent;border-radius:12px;background:var(--soft);color:var(--ink);font:600 26px Fredoka,sans-serif;min-height:58px;cursor:pointer;padding:0}
.pick:disabled{opacity:.5;cursor:default}
.pick.hint{border-color:var(--gold);background:var(--goldsoft)}
.pick.bad{animation:shake .35s;border-color:var(--bad)}
.pick.good{border-color:var(--green)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.pick.bad{animation:none}}
.msg{min-height:28px;font-weight:800;margin:10px 0 0}
.msg.ok{color:var(--green)}.msg.no{color:var(--bad)}
.tip{color:var(--mute);font-size:14px;margin:10px 0 0}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid color-mix(in srgb,var(--line) 20%,transparent);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#dock .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:999px;font:800 18px Nunito,sans-serif;min-height:50px;padding:0 22px;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.go{background:var(--green);color:#fff;flex:1;max-width:320px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.pick:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#score{margin-left:auto;font-weight:800;white-space:nowrap}
#lvbox{margin:12px 0 0}
@media(max-width:420px){.pick{font-size:22px;min-height:52px}.chip{font-size:20px;height:44px}.grid{gap:5px}#chips{gap:4px}}
</style>
</head>
<body>
<header class="band">
  <div><h1>Tonleiter</h1><a href="./">← Mitspielen</a><a href="noten.html">Noten lernen</a></div>
  <div class="seg" role="group" aria-label="Übung">
    <button data-ex="say" aria-pressed="true">Aufsagen</button>
    <button data-ex="gap" aria-pressed="false">Lücken</button>
    <button data-ex="nb" aria-pressed="false">Vor & nach</button>
  </div>
</header>

<main class="band">
  <div class="seg segd" id="lvbox" role="group" aria-label="Stufe"></div>
  <p class="ask" id="ask"></p>
  <div class="card">
    <div id="chips"></div>
    <svg id="sv" viewBox="0 0 420 150" aria-label="Tonleiter im Notensystem"></svg>
  </div>
  <div class="grid" id="keys"></div>
  <p class="msg" id="msg"></p>
  <p class="tip" id="tip">Zwischen E und F und zwischen H und C ist nur ein kleiner Schritt (½). Auf der Gitarre ist das 1 Bund, sonst sind es 2.</p>
</main>

<div id="dock"><div class="in">
  <button class="btn go" id="go">Neue Aufgabe</button>
  <button class="btn" id="hear" title="Tonleiter anhören">🔊</button>
  <span id="score">0 geschafft</span>
</div></div>

<script>
const N=['C','D','E','F','G','A','H'];
// the scale is played and drawn from the low octave (C3..H4 sounding), which is where it sits on the guitar
const SEMI=[0,2,4,5,7,9,11];
const $=id=>document.getElementById(id);
const LV={say:['C aufwärts','C abwärts','ab jedem Ton','rückwärts ab jedem Ton'],gap:['2 Lücken','4 Lücken','6 Lücken'],nb:['danach','davor','gemischt']};
let ex=localStorage.getItem('jb-tl-ex')||'say',lv=JSON.parse(localStorage.getItem('jb-tl-lv')||'{}'),seq=[],pos=0,fill=[],miss=0,done=0,task=null,busy=false;
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

// a scale of 8 steps from start index s (0 = C), up or down; step k gets a pitch and a staff position
function scale(s,down){const out=[];for(let k=0;k<8;k++){const st=down?s+7-k:s+k;out.push({i:st,n:N[st%7],midi:48+12*Math.floor(st/7)+SEMI[st%7]})}return out}
const half=(a,b)=>{const x=Math.min(a.i,b.i)%7;return x===2||x===6};   // E-F, H-C

// ---------- drawing
const G=12,BOT=104,ST=G/2;
const yOf=st=>BOT-(st-2)*ST;   // st = scale step from C3; written an octave up, so C3 is on the ledger line under the staff (E4 = bottom line = step 2)
function drawStaff(){const shown=seq.map((x,k)=>({x,k})).filter(o=>fill[o.k]!=null);let h=`<g class="st">${[0,1,2,3,4].map(k=>`<line x1="6" x2="414" y1="${BOT-k*G}" y2="${BOT-k*G}"/>`).join('')}</g>`;
  h+=`<text x="10" y="${BOT+9}" style="font:66px 'Noto Music',serif;fill:var(--ink)">𝄞</text><text x="31" y="${BOT+46}" text-anchor="middle" style="font:800 11px Nunito,sans-serif;fill:var(--ink)">8</text>`;
  for(const {x,k} of shown){const X=82+k*44,y=yOf(x.i);
    for(let l=0;l>=x.i;l-=2)h+=`<line x1="${X-15}" x2="${X+15}" y1="${yOf(l)}" y2="${yOf(l)}" stroke="var(--line)" stroke-width="1.5"/>`;
    for(let l=12;l<=x.i;l+=2)h+=`<line x1="${X-15}" x2="${X+15}" y1="${yOf(l)}" y2="${yOf(l)}" stroke="var(--line)" stroke-width="1.5"/>`;
    h+=`<ellipse class="nh ${fill[k]==='ok'?'ok':''}" cx="${X}" cy="${y}" rx="9" ry="6.3"/><ellipse cx="${X}" cy="${y}" rx="4.5" ry="3.1" transform="rotate(-35 ${X} ${y})" fill="var(--paper)"/>`}
  $('sv').innerHTML=h}
function drawChips(){$('chips').innerHTML=seq.map((x,k)=>{const f=fill[k],cls=f==='ok'?'on':f==='given'?'given':(k===pos&&ex!=='nb'?'next':'');
  const lift=ex==='say'||ex==='gap'?`style="transform:translateY(${-(seq[0].i<seq[7].i?k:7-k)*8}px)"`:'';
  const hb=k&&half(seq[k-1],x)?'<span class="half">½</span>':'';
  return `<div class="chip ${cls}" ${lift}>${hb}${f?x.n:(k===pos&&ex!=='nb'?'?':'')}</div>`}).join('');drawStaff()}

// ---------- tasks
function newTask(){busy=false;$('msg').textContent='';$('msg').className='msg';miss=0;const L=lv[ex]||0;
  if(ex==='say'){const s=L<2?0:rnd(7),down=L===1||L===3;seq=scale(s,down);fill=Array(8).fill(null);fill[0]='given';pos=1;
    $('ask').innerHTML=`Sag die Tonleiter ${down?'<b>rückwärts</b>':'<b>aufwärts</b>'} von <b>${seq[0].n}</b> bis <b>${seq[7].n}</b>. Tippe die Töne der Reihe nach.`;
    task={type:'seq'}}
  if(ex==='gap'){const s=rnd(7),down=Math.random()<.3;seq=scale(s,down);const gaps=shuffle([1,2,3,4,5,6,7]).slice(0,[2,4,6][L]).sort((a,b)=>a-b);
    fill=seq.map((_,k)=>gaps.includes(k)?null:'given');pos=gaps[0];
    $('ask').innerHTML=`Fülle die Lücken${down?' (die Tonleiter geht <b>abwärts</b>)':''}. Tippe die fehlenden Töne von links nach rechts.`;task={type:'seq'}}
  if(ex==='nb'){const s=rnd(7),after=L===0?true:L===1?false:Math.random()<.5;
    seq=after?scale(s,false).slice(0,2):scale((s+6)%7,false).slice(0,2);fill=after?['given',null]:[null,'given'];pos=after?1:0;
    $('ask').innerHTML=after?`Welcher Ton kommt <b>nach ${seq[0].n}</b>?`:`Welcher Ton kommt <b>vor ${seq[1].n}</b>?`;task={type:'one'}}
  $('keys').innerHTML=shuffle(N.slice()).map(n=>`<button class="pick" data-n="${n}">${n}</button>`).join('');
  drawChips();$('go').textContent='Neue Aufgabe'}
function nextGap(){let k=pos+1;while(k<8&&fill[k])k++;return k}
function tap(b){if(busy)return;const want=seq[pos].n,n=b.dataset.n;
  if(n===want){fill[pos]='ok';play(seq[pos].midi);b.classList.remove('bad');document.querySelectorAll('.pick.hint').forEach(x=>x.classList.remove('hint'));
    b.classList.add('good');setTimeout(()=>b.classList.remove('good'),250);
    pos=task.type==='one'?8:nextGap();drawChips();
    if(pos>=8){busy=true;done++;$('score').textContent=done+' geschafft';$('msg').className='msg ok';
      $('msg').textContent=miss?`Geschafft! (${miss} Fehler)`:'Super, alles richtig!';
      if(task.type==='seq')setTimeout(()=>playAll(),300);
      $('go').textContent='Weiter →'}}
  else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('msg').className='msg no';$('msg').textContent=`${n} ist es nicht. Versuch es nochmal.`;
    if(miss%2===0)document.querySelector(`.pick[data-n="${want}"]`).classList.add('hint')}}
$('keys').addEventListener('click',e=>{const b=e.target.closest('.pick');if(b)tap(b)});
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase();if(N.includes(k)){const b=document.querySelector(`.pick[data-n="${k}"]`);if(b)tap(b)}else if(e.key==='Enter')newTask()});
$('go').onclick=newTask;
$('hear').onclick=playAll;

// ---------- levels and exercise switch
function setEx(x){ex=x;localStorage.setItem('jb-tl-ex',ex);document.querySelectorAll('[data-ex]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ex===ex));
  $('lvbox').innerHTML=LV[ex].map((t,i)=>`<button data-lv="${i}" aria-pressed="${(lv[ex]||0)===i}">${t}</button>`).join('');newTask()}
document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>setEx(b.dataset.ex));
$('lvbox').addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(!b)return;lv[ex]=+b.dataset.lv;localStorage.setItem('jb-tl-lv',JSON.stringify(lv));
  document.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',x===b));newTask()});

// ---------- sound: plucked string (Karplus-Strong)
let ctx=null;const bufs={};
function buf(midi){if(bufs[midi])return bufs[midi];const sr=ctx.sampleRate,P=Math.round(sr/(440*2**((midi-69)/12))),len=Math.floor(sr*1.6),b=ctx.createBuffer(1,len,sr),y=b.getChannelData(0);
  for(let i=0;i<P;i++)y[i]=Math.random()*2-1;for(let i=P;i<len;i++)y[i]=.996*.5*(y[i-P]+y[i-P+1>=i?i-P:i-P+1]);
  let m=0;for(let i=0;i<len;i++)m=Math.max(m,Math.abs(y[i]));for(let i=0;i<len;i++)y[i]/=m;return bufs[midi]=b}
function play(midi,at){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();const t=at||ctx.currentTime;
  const s=ctx.createBufferSource(),g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;g.gain.value=.6;
  s.buffer=buf(midi);s.connect(lp).connect(g).connect(ctx.destination);s.start(t);s.stop(t+1.6)}
function playAll(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime+.05;seq.forEach((x,k)=>play(x.midi,t+k*.32))}

setEx(ex);
document.fonts&&document.fonts.ready.then(drawStaff);
</script>
</body>
</html>
