<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.webmanifest">
<title>Jingle Bells – Noten lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Same look as the play-along page: red header, white paper, green = right, gold = selected.
   One task at a time: note name, staff and TAB; one or two of them are missing and get filled in by tapping. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121417);--ink:light-dark(#16181d,#eef0f3);--paper:light-dark(#ffffff,#1b1e24);--soft:light-dark(#f4f1ec,#22262d);--line:light-dark(#2a2d33,#c9ced6);--mute:light-dark(#6b6f78,#9aa1ac);--red:light-dark(#c8102e,#a80d27);--green:light-dark(#1d7a4f,#2fa36c);--gold:#f2b705;--goldsoft:light-dark(#fff3c4,#4a3b08);--bad:light-dark(#c8102e,#ff6b7f)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.band{padding:14px max(4vw,16px,env(safe-area-inset-right)) 14px max(4vw,16px,env(safe-area-inset-left))}
header{background:var(--red);color:#fff;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-top:max(14px,calc(env(safe-area-inset-top) + 6px))!important}
h1{font:600 clamp(26px,5vw,40px)/1.05 Fredoka,system-ui,sans-serif;margin:0}
header a{color:#fff;font-weight:800;text-decoration:none;opacity:.92}
header a:hover{text-decoration:underline}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:inherit;font:700 15px Nunito,sans-serif;padding:8px 16px;border-radius:999px;min-height:42px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#a00d25}
main{max-width:760px;margin:0 auto}
.prog{display:flex;align-items:center;gap:12px;font-weight:800;color:var(--mute)}
.bar{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.ask{font:600 20px/1.3 Fredoka,sans-serif;margin:10px 0 12px}
.card{background:var(--soft);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.lbl{font:800 13px Nunito,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lbl .res{text-transform:none;letter-spacing:0;font-size:15px}
.res.ok{color:var(--green)}.res.no{color:var(--bad)}
#nameShow{font:600 40px/1.1 Fredoka,sans-serif;color:var(--red);min-height:44px}
#nameShow.empty{color:var(--mute);font-size:22px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pick{border:2px solid transparent;border-radius:12px;background:var(--paper);color:var(--ink);font:700 18px Nunito,sans-serif;min-height:48px;cursor:pointer}
.pick[aria-pressed=true]{border-color:var(--gold);background:var(--goldsoft)}
.pick:disabled{cursor:default;opacity:.55}
.pick.right{border-color:var(--green);opacity:1}
#sv{width:100%;max-width:560px;margin:0 auto;height:auto;display:block;background:var(--paper);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.st line{stroke:var(--line);stroke-width:1.3}
.tb line{stroke:var(--line);stroke-width:1.2;opacity:.75}
.hit{fill:transparent;cursor:pointer}
.tbsel{fill:var(--goldsoft)}
.nh{fill:var(--ink)}
.ghost{opacity:.3}
.okc{fill:var(--green)!important}.badc{fill:var(--bad)!important}
.fretn{font:800 20px Nunito,sans-serif;text-anchor:middle;fill:var(--ink)}
.fretbg{fill:var(--paper)}
.hint{color:var(--mute);font-size:14px;margin:8px 0 0}
#frets{display:flex;gap:6px;margin-top:10px;align-items:center}
#frets .pick{flex:1;max-width:60px;padding:0}
#frets span{margin-right:4px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid color-mix(in srgb,var(--line) 20%,transparent);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#dock .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.btn{border:0;border-radius:999px;font:800 18px Nunito,sans-serif;min-height:50px;padding:0 22px;cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.go{background:var(--green);color:#fff;flex:1;max-width:320px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.pick:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#score{margin-left:auto;font-weight:800;white-space:nowrap}
#done{display:none;text-align:center;padding:30px 10px}
#done h2{font:600 34px Fredoka,sans-serif;margin:0 0 8px;color:var(--green)}
.fin #task{display:none}.fin #done{display:block}
@media(max-height:500px){header p{display:none}#nameShow{font-size:30px}}
</style>
</head>
<body>
<header class="band">
  <div><h1>Noten lernen</h1><a href="./">← Zurück zum Mitspielen</a> <a href="tonleiter.html" style="margin-left:12px">Tonleiter →</a></div>
  <div class="segs">
  <div class="seg" role="group" aria-label="Schwierigkeit">
    <button data-lv="1" aria-pressed="true">Leicht</button>
    <button data-lv="2" aria-pressed="false">Schwer</button>
  </div>
  <div class="seg" role="group" aria-label="Welche Töne">
    <button data-more="0" aria-pressed="true">9 Töne</button>
    <button data-more="1" aria-pressed="false">13 Töne</button>
  </div>
  </div>
</header>

<main class="band">
  <div class="prog"><span id="cnt">1 / 27</span><div class="bar"><i id="pbar"></i></div></div>
  <section id="task">
    <p class="ask" id="ask"></p>
    <div class="card">
      <div class="lbl"><span>Notenname</span><span class="res" id="rName"></span></div>
      <div id="nameShow"></div>
      <div class="grid" id="names" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <div class="lbl"><span>Noten und Tab</span><span class="res" id="rSv"></span></div>
      <svg id="sv" viewBox="0 0 400 286" aria-label="Notensystem und Tabulatur"></svg>
      <div id="frets"><span style="font-weight:800">Bund:</span></div>
      <p class="hint" id="svHint"></p>
    </div>
  </section>
  <section id="done">
    <h2>Geschafft!</h2>
    <p id="doneTxt"></p>
    <button class="btn go" id="again">Nochmal</button>
  </section>
</main>

<div id="dock"><div class="in">
  <button class="btn go" id="go" disabled>Prüfen</button>
  <button class="btn" id="hear" title="Ton anhören">🔊</button>
  <span id="score">0 richtig</span>
</div></div>

<script>
// The 9 pitches of the Jingle Bells melody in C major with the guitar positions used in the play-along app.
// d = written staff step above the bottom line (E4 = 0); guitar is written an octave above how it sounds.
const ALL=[
  {n:'tiefes C',midi:48,d:-2,s:5,f:3,x:1},{n:'tiefes D',midi:50,d:-1,s:4,f:0,x:1},
  {n:'tiefes E',midi:52,d:0,s:4,f:2,x:1},{n:'tiefes F',midi:53,d:1,s:4,f:3,x:1},
  {n:'tiefes G',midi:55,d:2,s:3,f:0},{n:'tiefes A',midi:57,d:3,s:3,f:2},{n:'H',midi:59,d:4,s:2,f:0},
  {n:'C',midi:60,d:5,s:2,f:1},{n:'D',midi:62,d:6,s:2,f:3},{n:'E',midi:64,d:7,s:1,f:0},
  {n:'F',midi:65,d:8,s:1,f:1},{n:'hohes G',midi:67,d:9,s:1,f:3},{n:'hohes A',midi:69,d:10,s:1,f:5}];
// x: extra notes below the melody range (D and A string), only in the "more notes" set
let more=localStorage.getItem('jb-noten-more')==='1',P=ALL.filter(p=>more||!p.x);
const KIND=['name','staff','tab'];
const $=id=>document.getElementById(id);
let level=+(localStorage.getItem('jb-noten-lv')||1),queue=[],idx=0,total=0,firstOk=0,cur=null,ans={},checked=false,selString=0;

// ---------- drawing
const W=400,G=14,BOT=110,STEP=G/2,TT=184,TG=18,NX=250,DMIN=-3,DMAX=11;
const yOf=d=>BOT-d*STEP;
function noteSvg(d,cls,X=NX){let h='';const y=yOf(d);
  for(let l=-2;l>=d;l-=2)h+=`<line x1="${X-17}" x2="${X+17}" y1="${yOf(l)}" y2="${yOf(l)}" stroke="var(--line)" stroke-width="1.6"/>`;
  for(let l=10;l<=d;l+=2)h+=`<line x1="${X-17}" x2="${X+17}" y1="${yOf(l)}" y2="${yOf(l)}" stroke="var(--line)" stroke-width="1.6"/>`;
  return `<g class="${cls}">${h}<ellipse class="nh ${cls}" cx="${X}" cy="${y}" rx="10.5" ry="7.2"/><ellipse cx="${X}" cy="${y}" rx="5.2" ry="3.6" transform="rotate(-35 ${X} ${y})" fill="var(--paper)"/></g>`}
function fretSvg(s,f,cls){const y=TT+(s-1)*TG;return `<g><rect class="fretbg" x="${NX-13}" y="${y-12}" width="26" height="24"/><text class="fretn ${cls}" x="${NX}" y="${y+7}">${f}</text></g>`}
function draw(ghost){const t=cur.p,st=missing('staff'),tb=missing('tab');let h='';
  h+=`<g class="st">${[0,1,2,3,4].map(k=>`<line x1="10" x2="${W-10}" y1="${BOT-k*G}" y2="${BOT-k*G}"/>`).join('')}</g>`;
  h+=`<text x="16" y="${BOT+12}" style="font:78px 'Noto Music',serif;fill:var(--ink)">𝄞</text><text x="41" y="${BOT+57}" text-anchor="middle" style="font:800 13px Nunito,sans-serif;fill:var(--ink)">8</text>`;
  h+=`<g class="tb">${[0,1,2,3,4,5].map(k=>`<line x1="10" x2="${W-10}" y1="${TT+k*TG}" y2="${TT+k*TG}"/>`).join('')}</g>`;
  h+=['T','A','B'].map((c,k)=>`<text x="22" y="${TT+26+k*24}" style="font:800 22px Nunito;fill:var(--ink)">${c}</text>`).join('');
  // staff note: given, answered, ghost while hovering, solution after a wrong answer
  if(!st)h+=noteSvg(t.d,'');
  else{if(ghost!=null&&!checked)h+=noteSvg(ghost,'ghost');
    if(ans.d!=null)h+=noteSvg(ans.d,checked?(ans.d===t.d?'okc':'badc'):'');
    if(checked&&ans.d!==t.d)h+=noteSvg(t.d,'okc',NX+46)}
  if(!tb)h+=fretSvg(t.s,t.f,'');
  else{if(!checked&&selString)h+=`<rect class="tbsel" x="70" y="${TT+(selString-1)*TG-8}" width="${W-90}" height="16" rx="8"/>`;
    if(ans.s&&ans.f!=null)h+=fretSvg(ans.s,ans.f,checked?(ans.s===t.s&&ans.f===t.f?'okc':'badc'):'');
    else if(selString&&!checked)h+=`<circle cx="${NX}" cy="${TT+(selString-1)*TG}" r="9" fill="var(--gold)"/>`;
    if(checked&&!(ans.s===t.s&&ans.f===t.f))h+=`<g transform="translate(46 0)">${fretSvg(t.s,t.f,'okc')}</g>`;
    for(let k=1;k<=6;k++)h+=`<rect class="hit" data-s="${k}" x="60" y="${TT+(k-1)*TG-9}" width="${W-70}" height="18"/>`}
  if(st)h+=`<rect class="hit" id="stHit" x="60" y="${yOf(DMAX)-8}" width="${W-70}" height="${yOf(DMIN)-yOf(DMAX)+16}"/>`;
  $('sv').innerHTML=h}

// ---------- task flow
function missing(k){return cur&&cur.miss.includes(k)}
function build(){P=ALL.filter(p=>more||!p.x);const items=[];
  // 9 notes: every note in all 3 variants (27 tasks); 13 notes: 2 random variants each (26 tasks)
  for(const p of P){const ks=more?KIND.slice().sort(()=>Math.random()-.5).slice(0,2):KIND;
    for(const k of ks)items.push({p,miss:level===1?[k]:KIND.filter(x=>x!==k)})}
  for(let tries=0;tries<200;tries++){items.sort(()=>Math.random()-.5);if(items.every((x,i)=>!i||x.p!==items[i-1].p))break}
  queue=items;idx=0;total=items.length;firstOk=0;document.body.classList.remove('fin');show()}
function show(){cur=queue[idx];ans={};checked=false;selString=0;
  $('cnt').textContent=`${Math.min(idx+1,queue.length)} / ${queue.length}`;$('pbar').style.width=(100*idx/queue.length)+'%';
  const need=cur.miss.map(k=>({name:'den Notennamen',staff:'die Note im Notensystem',tab:'die Bundzahl im Tab'})[k]);
  $('ask').textContent='Ergänze '+need.join(' und ')+'.'+(cur.again?' (Nochmal)':'');
  $('nameShow').textContent=missing('name')?'Welcher Ton ist das?':cur.p.n;$('nameShow').classList.toggle('empty',missing('name'));
  $('names').style.display=missing('name')?'':'none';
  $('names').innerHTML=missing('name')?P.map((p,i)=>`<button class="pick" data-i="${i}" aria-pressed="false">${p.n}</button>`).join(''):'';
  $('frets').style.display=missing('tab')?'':'none';
  $('frets').innerHTML='<span style="font-weight:800">Bund:</span>'+[0,1,2,3,4,5].map(f=>`<button class="pick" data-f="${f}" aria-pressed="false" disabled>${f}</button>`).join('');
  const hs=[];if(missing('staff'))hs.push('Tippe ins Notensystem, wo die Note hingehört.');if(missing('tab'))hs.push('Tippe im Tab auf die Saite und dann unten auf die Bundzahl.');
  $('svHint').textContent=hs.join(' ');$('svHint').style.display=hs.length?'':'none';
  $('rName').textContent='';$('rSv').textContent='';
  $('go').textContent='Prüfen';draw();update()}
function complete(){return (!missing('name')||ans.i!=null)&&(!missing('staff')||ans.d!=null)&&(!missing('tab')||(ans.s&&ans.f!=null))}
function update(){$('go').disabled=!checked&&!complete()}
function check(){const t=cur.p;checked=true;let ok=true;
  if(missing('name')){const r=P[ans.i]===t;ok&&=r;$('rName').textContent=r?'✓ richtig':'✗ richtig ist: '+t.n;$('rName').className='res '+(r?'ok':'no');
    document.querySelectorAll('#names .pick').forEach(b=>{b.disabled=true;if(P[+b.dataset.i]===t)b.classList.add('right')})}
  const msg=[];
  if(missing('staff')){const r=ans.d===t.d;ok&&=r;msg.push(r?'Note ✓':'Note ✗')}
  if(missing('tab')){const r=ans.s===t.s&&ans.f===t.f;ok&&=r;msg.push(r?'Tab ✓':`Tab ✗ (${t.s}. Saite, Bund ${t.f})`)}
  if(msg.length){$('rSv').textContent=msg.join(' · ');$('rSv').className='res '+(msg.some(m=>m.includes('✗'))?'no':'ok')}
  document.querySelectorAll('#frets .pick').forEach(b=>b.disabled=true);
  if(ok&&!cur.again)firstOk++;
  if(!ok&&!cur.again)queue.push({p:t,miss:cur.miss,again:true});
  $('score').textContent=firstOk+' richtig';
  play(t.midi);$('go').textContent='Weiter →';draw();update()}
function next(){idx++;if(idx>=queue.length){$('pbar').style.width='100%';document.body.classList.add('fin');
    $('doneTxt').textContent=`${firstOk} von ${total} Aufgaben beim ersten Mal richtig.`+(firstOk===total?' Alles richtig, super!':' Die anderen hast du am Ende nochmal geübt.');$('go').disabled=true;return}
  show()}

// ---------- input
function svgPoint(e){const sv=$('sv'),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(sv.getScreenCTM().inverse())}
const stepAt=y=>Math.max(DMIN,Math.min(DMAX,Math.round((BOT-y)/STEP)));
$('sv').addEventListener('pointermove',e=>{if(checked||!missing('staff'))return;const p=svgPoint(e);if(p.y>=yOf(DMAX)-8&&p.y<=yOf(DMIN)+8)draw(stepAt(p.y));else draw()});
$('sv').addEventListener('pointerleave',()=>{if(cur&&!checked)draw()});
$('sv').addEventListener('click',e=>{if(checked)return;const hit=e.target.closest('.hit');if(!hit)return;const p=svgPoint(e);
  if(hit.dataset.s){selString=+hit.dataset.s;ans.s=selString;document.querySelectorAll('#frets .pick').forEach(b=>b.disabled=false);
    draw();update();return}
  if(hit.id==='stHit'){ans.d=stepAt(p.y);draw();update()}});
$('names').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b||checked)return;ans.i=+b.dataset.i;
  document.querySelectorAll('#names .pick').forEach(x=>x.setAttribute('aria-pressed',x===b));update()});
$('frets').addEventListener('click',e=>{const b=e.target.closest('.pick');if(!b||checked||!selString)return;ans.f=+b.dataset.f;ans.s=selString;
  document.querySelectorAll('#frets .pick').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();update()});
$('go').onclick=()=>checked?next():complete()&&check();
$('again').onclick=build;
$('hear').onclick=()=>cur&&play(cur.p.midi);
document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{level=+b.dataset.lv;localStorage.setItem('jb-noten-lv',level);
  document.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',x===b));build()});
document.querySelectorAll('[data-lv]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.lv===level));
document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{more=b.dataset.more==='1';localStorage.setItem('jb-noten-more',more?'1':'0');
  document.querySelectorAll('[data-more]').forEach(x=>x.setAttribute('aria-pressed',x===b));build()});
document.querySelectorAll('[data-more]').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.more==='1')===more));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('go').disabled){e.preventDefault();$('go').click()}});

// ---------- sound: a plucked string (Karplus-Strong), same as in the play-along page
let ctx=null;const bufs={};
function play(midi){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
  if(!bufs[midi]){const sr=ctx.sampleRate,P2=Math.round(sr/(440*2**((midi-69)/12))),len=Math.floor(sr*1.8),b=ctx.createBuffer(1,len,sr),y=b.getChannelData(0);
    for(let i=0;i<P2;i++)y[i]=Math.random()*2-1;for(let i=P2;i<len;i++)y[i]=.996*.5*(y[i-P2]+y[i-P2+1>=i?i-P2:i-P2+1]);
    let m=0;for(let i=0;i<len;i++)m=Math.max(m,Math.abs(y[i]));for(let i=0;i<len;i++)y[i]/=m;bufs[midi]=b}
  const s=ctx.createBufferSource(),g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;g.gain.value=.6;
  s.buffer=bufs[midi];s.connect(lp).connect(g).connect(ctx.destination);s.start()}

build();
document.fonts&&document.fonts.ready.then(()=>cur&&draw());
</script>
</body>
</html>
